# Local development: Postgres, the Django API and the Vite dev server.
#   cp .env.example .env    (fill in GOOGLE_CLIENT_ID and ALLOWED_EMAILS)
#   docker compose up --build
# Then open http://localhost:5173. Nothing here touches the cloud.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: financial_tracker
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack-local-only
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d financial_tracker"]
      interval: 2s
      retries: 20

  api:
    build:
      context: ./api
      target: base
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://fintrack:fintrack-local-only@db:5432/financial_tracker
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    volumes:
      - ./api:/app
      - /app/.venv
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_APP_ENV: local
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db-data:
