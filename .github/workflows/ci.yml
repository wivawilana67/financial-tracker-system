# Tests for the new stack (api/ and frontend/). No cloud access, no secrets.
#   api:      builds the Docker image's test stage, which runs pytest inside the image
#   frontend: npm ci, vitest, type check and production build

name: CI

on:
  pull_request:
    paths:
      - 'api/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [develop, master]
    paths:
      - 'api/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests in the image
        run: docker build --target test api

  frontend:
    name: Web app tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
