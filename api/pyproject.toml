[project]
name = "fintrack-api"
version = "0.1.0"
description = "Financial Tracker REST API (Django + DRF)"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.18,<3.19",
    "dj-database-url>=3.1,<4",
    "psycopg[binary]>=3.3,<4",
    "google-auth>=2.63,<3",
    "requests>=2.34,<3",
    "gunicorn>=27,<28",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-django>=4.14,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
# WhiteNoise warns when collectstatic has not run; the Docker image runs it.
filterwarnings = ["ignore:No directory at:UserWarning"]
