<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 24px;
        color: #1e293b;
        background-color: #f8fafc;
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      
      /* Card Container */
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        padding: 32px;
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }

      /* Views */
      #loadingView {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        flex-grow: 1;
        animation: fadeIn 0.4s ease-out;
      }
      
      #summaryView {
        display: none;
        flex-direction: column;
        height: 100%;
        animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #errorView {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        flex-grow: 1;
        animation: fadeIn 0.4s ease-out;
      }
      
      /* Progress Spinner */
      .spinner-container {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
      }
      .spinner {
        box-sizing: border-box;
        width: 80px;
        height: 80px;
        border: 6px solid #f1f5f9;
        border-top: 6px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .spinner-glow {
        position: absolute;
        top: 0;
        left: 0;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        animation: pulse 2s infinite ease-in-out;
        pointer-events: none;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.2; }
        50% { transform: scale(1.05); opacity: 0.6; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      h2 {
        margin: 0 0 8px 0;
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
      }
      p.subtitle {
        margin: 0 0 24px 0;
        font-size: 14px;
        color: #64748b;
        line-height: 1.5;
      }
      
      /* Report List Style */
      .report-scroll-area {
        flex-grow: 1;
        overflow-y: auto;
        border: 1px solid #e2e8f0;
        padding: 20px;
        border-radius: 12px;
        background: #f8fafc;
        margin-bottom: 24px;
      }
      
      .meta-info {
        font-size: 13px;
        color: #475569;
        padding-bottom: 12px;
        border-bottom: 1px dashed #cbd5e1;
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      
      .sheet-block {
        margin-bottom: 20px;
      }
      .sheet-title {
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 8px;
        border-left: 4px solid #3b82f6;
        padding-left: 8px;
        background: #e0f2fe;
        padding-top: 4px;
        padding-bottom: 4px;
        border-radius: 0 6px 6px 0;
      }
      .audit-subheadline {
        font-size: 12px;
        font-weight: 600;
        margin-top: 8px;
        margin-bottom: 4px;
        padding-left: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .app-title { color: #16a34a; }
      .warn-title { color: #d97706; }
      .via-tag {
        font-size: 10px;
        font-weight: 600;
        color: #475569;
        background: #e2e8f0;
        border-radius: 4px;
        padding: 1px 5px;
        margin-left: 4px;
      }
      
      .item-list {
        margin: 0 0 10px 0;
        padding-left: 24px;
        font-size: 13px;
        color: #334155;
        line-height: 1.6;
      }
      .item-list span {
        font-weight: 600;
      }
      .none-text {
        font-size: 13px;
        color: #94a3b8;
        font-style: italic;
        padding-left: 24px;
        margin-bottom: 10px;
      }

      /* Buttons */
      button.btn-secondary {
        background: #64748b;
        color: white;
        border: none;
        padding: 14px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        border-radius: 10px;
        transition: all 0.2s ease;
      }
      button.btn-secondary:hover {
        background: #475569;
      }

      /* Error Icon */
      .error-icon {
        color: #dc2626;
        font-size: 48px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      
      <!-- 1. LOADING VIEW -->
      <div id="loadingView">
        <div class="spinner-container">
          <div class="spinner"></div>
          <div class="spinner-glow"></div>
        </div>
        <h2>Updating Paid Status</h2>
        <p class="subtitle">Matching the Dashboard checklists against the ledgers. Please wait...</p>
      </div>

      <!-- 2. SUMMARY VIEW -->
      <div id="summaryView">
        <h2>Paid Status Updated</h2>
        <p class="subtitle">Rows ticked "Sudah Bayar?" from the Dashboard checklists, grouped per payment channel.</p>
        
        <div id="reportContainerScrollBox" class="report-scroll-area"></div>
        
        <button class="btn-secondary" onclick="google.script.host.close()">Close Dialog</button>
      </div>

      <!-- 3. ERROR VIEW -->
      <div id="errorView">
        <div class="error-icon">⚠️</div>
        <h2>Update Failed</h2>
        <p id="errorMessage" class="subtitle" style="color: #dc2626;"></p>
        <button class="btn-secondary" onclick="google.script.host.close()">Close Dialog</button>
      </div>

    </div>

    <script>
      window.onload = function() {
        runAutomation();
      };

      function runAutomation() {
        google.script.run
          .withSuccessHandler(renderFinalSummaryReport)
          .withFailureHandler(function(error) {
            showError(error.message || "Server error occurred during execution.");
          })
          .updatePaidStatus();
      }

      function showError(msg) {
        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('summaryView').style.display = 'none';
        document.getElementById('errorMessage').innerText = msg;
        document.getElementById('errorView').style.display = 'flex';
      }

      function renderFinalSummaryReport(report) {
        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('summaryView').style.display = 'flex';

        var html = '<div class="meta-info">' +
                     '<span><b>Target Month:</b> ' + escapeHtml(report.monthStr) + '</span>' +
                     '<span><b>Rows marked paid:</b> ' + report.updated + '</span>' +
                   '</div>';

        if (report.nothingSelected) {
          html += '<div class="none-text">Nothing is ticked on the Dashboard, so nothing was changed.</div>';
        }

        report.channels.forEach(function(group) {
          var scope = group.wholeChannel ? ' <span class="via-tag">Whole channel</span>' : '';
          html += '<div class="sheet-block"><div class="sheet-title">' + escapeHtml(group.name) + scope + '</div>';
          if (group.items.length === 0) {
            html += '<div class="none-text">No unpaid rows left for this month.</div>';
          } else {
            html += '<ol class="item-list">';
            group.items.forEach(function(item) {
              var sheetTag = '<span style="color:#64748b; font-size:11px; font-weight:normal;"> (' + escapeHtml(item.sheet) + ')</span>';
              var amtHtml = '<span style="color:#10b981; font-weight:600;">' + escapeHtml(item.amountFormatted) + '</span>';
              html += '<li><b>' + escapeHtml(item.list) + '</b>' + sheetTag + ' - ' + escapeHtml(item.type) +
                      ' - ' + amtHtml + ' <span class="via-tag">' + escapeHtml(item.via) + '</span></li>';
            });
            html += '</ol>';
          }
          html += '</div>';
        });

        if (report.unmatchedRows.length) {
          html += '<div class="sheet-block"><div class="audit-subheadline warn-title">Ticked rows with no ledger match:</div><ol class="item-list">';
          report.unmatchedRows.forEach(function(row) {
            html += '<li><b>' + escapeHtml(row.list) + '</b> - ' + escapeHtml(row.type || '—') + ' - ' + escapeHtml(row.channel || '—') + '</li>';
          });
          html += '</ol></div>';
        }

        if (report.missingSheets.length) {
          html += '<div class="none-text">Sheets not found (skipped): ' + escapeHtml(report.missingSheets.join(', ')) + '</div>';
        }

        document.getElementById('reportContainerScrollBox').innerHTML = html;
      }

      function escapeHtml(text) {
        if (!text) return '';
        var map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };
        return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
      }
    </script>
  </body>
</html>
