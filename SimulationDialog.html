<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f1f5f9;
        --surface: #ffffff;
        --surface-2: #f8fafc;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --text: #0f172a;
        --text-soft: #475569;
        --muted: #64748b;
        --subtle: #94a3b8;
        --brand: #2563eb;
        --brand-soft: #eff6ff;
        --brand-border: #bfdbfe;
        --ok: #059669;
        --ok-soft: #ecfdf5;
        --ok-border: #a7f3d0;
        --warn: #b45309;
        --warn-soft: #fffbeb;
        --warn-border: #fde68a;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
        --danger-border: #fecaca;
        --c-saving: #059669;
        --c-expense: #2563eb;
        --c-jajan: #d97706;
        --c-ibadah: #7c3aed;
        --c-auto: #db2777;
        --c-left: #cbd5e1;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px; line-height: 1.5; color: var(--text); background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      .app { display: flex; flex-direction: column; height: 100%; }
      .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

      /* ---------- Top bar ---------- */
      .topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 12px 18px; background: var(--surface);
        border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); z-index: 2;
      }
      .topbar-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
      .topbar-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
      .dry-run {
        display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
        background: var(--warn-soft); border: 1px solid var(--warn-border); color: var(--warn);
        font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      }
      .topbar-period { display: flex; gap: 8px; flex: 0 0 auto; }
      .topbar-period select { width: auto; min-width: 110px; padding: 7px 10px; font-weight: 600; }
      .topbar-period select#simYear { min-width: 80px; }

      /* ---------- Summary strip (pinned) ---------- */
      .summary { padding: 12px 18px 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
      .hero { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .hero-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
      .hero-value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
      .hero-value.is-negative { color: var(--danger); }
      .hero-meta { font-size: 12px; color: var(--text-soft); font-weight: 600; }
      .bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--c-left); margin: 8px 0 10px; }
      .bar span { display: block; height: 100%; transition: width .2s ease; }
      .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .tile {
        border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px;
        background: var(--surface-2); border-left-width: 4px; min-width: 0;
      }
      .tile-label { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
      .tile-value { font-size: 13.5px; font-weight: 700; }
      .tile-meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
      .delta { font-weight: 700; }
      .delta.good { color: var(--ok); }
      .delta.bad { color: var(--danger); }
      .delta.flat { color: var(--subtle); font-weight: 500; }

      /* ---------- Scroll area ---------- */
      .content { flex: 1 1 auto; overflow-y: auto; padding: 14px 18px 18px; }
      .card {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        box-shadow: var(--shadow-sm); padding: 14px 16px; margin-bottom: 14px;
      }
      .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
      .card-title { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-soft); }
      .card-note { font-size: 11.5px; color: var(--subtle); font-weight: 500; }
      .card-total { font-size: 12.5px; font-weight: 700; }
      .badge {
        display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600;
        border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); margin-left: 6px;
        text-transform: none; letter-spacing: 0;
      }
      .badge.existing { background: var(--brand-soft); border-color: var(--brand-border); color: var(--brand); }
      .badge.projected { background: var(--warn-soft); border-color: var(--warn-border); color: var(--warn); }

      /* ---------- Forms ---------- */
      label { display: block; font-weight: 600; font-size: 11.5px; color: var(--text-soft); }
      select, input[type="text"], input[type="number"] {
        width: 100%; padding: 7px 9px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
        font-family: inherit; font-size: 13px; color: var(--text); background: var(--surface);
      }
      select:focus, input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, .14); }
      input.is-invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(220, 38, 38, .12); }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .subpanel { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
      .subpanel-head { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }

      .income-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
      .income-row span { font-size: 12.5px; color: var(--text-soft); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .income-row input { width: 140px; flex: 0 0 auto; text-align: right; font-weight: 600; }

      .rate-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
      .chip-set { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip {
        display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
        border: 1px solid var(--border-strong); background: var(--surface); font-size: 11.5px; font-weight: 500; cursor: pointer;
      }
      .chip.is-on { background: var(--brand-soft); border-color: var(--brand-border); color: var(--brand); }
      .chip input { margin: 0; }
      .jajan-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
      .jajan-table th { text-align: right; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--border); }
      .jajan-table th:first-child, .jajan-table td:first-child { text-align: left; }
      .jajan-table td { text-align: right; padding: 5px 6px; border-bottom: 1px dashed var(--border); }
      .jajan-table td.strong { font-weight: 700; }

      /* ---------- Item rows ---------- */
      .item {
        display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid var(--border);
        border-radius: var(--radius-sm); margin-bottom: 5px; background: var(--surface);
      }
      .item.is-off { opacity: .5; background: var(--surface-2); }
      .item.is-off .item-name { text-decoration: line-through; }
      .item.is-changed { border-color: var(--brand-border); background: var(--brand-soft); }
      .item.is-added { border-color: var(--ok-border); background: var(--ok-soft); }
      .item input[type="checkbox"] { flex: 0 0 auto; width: 15px; height: 15px; margin: 0; }
      .item-main { flex: 1 1 auto; min-width: 0; }
      .item-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item-meta { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item-base { flex: 0 0 auto; font-size: 12px; color: var(--text-soft); min-width: 92px; text-align: right; }
      .item-base.is-struck { text-decoration: line-through; color: var(--subtle); }
      .item input.item-amount { width: 120px; flex: 0 0 auto; text-align: right; font-weight: 600; }
      .item input.item-list { flex: 1 1 auto; min-width: 0; }
      .item select.item-type { width: 140px; flex: 0 0 auto; }
      .cicilan { display: inline-block; padding: 0 6px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; margin-left: 4px; }

      .btn {
        padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
        background: var(--surface); color: var(--text); font-family: inherit; font-weight: 600; font-size: 12px; cursor: pointer;
      }
      .btn:hover { background: var(--surface-2); }
      .btn-add { width: 100%; border-style: dashed; color: var(--brand); margin-top: 2px; }
      .btn-remove { padding: 4px 8px; color: var(--danger); border-color: var(--danger-border); flex: 0 0 auto; }
      .empty { font-size: 12px; color: var(--subtle); padding: 6px 2px; }

      /* ---------- Section tabs (same strip as Generate Monthly Data) ---------- */
      .tab-strip {
        display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; margin-bottom: 12px;
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
      }
      .tab {
        display: inline-flex; align-items: center; gap: 6px;
        border: 0; background: transparent; cursor: pointer;
        padding: 6px 10px; border-radius: 7px;
        font-family: inherit; font-size: 12px; font-weight: 600; color: var(--muted);
        transition: background .15s ease, color .15s ease;
      }
      .tab:hover { color: var(--text); }
      .tab.is-active { background: var(--surface); color: var(--brand); box-shadow: var(--shadow-sm); }
      .tab-count {
        font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
        background: var(--border); color: var(--text-soft); font-variant-numeric: tabular-nums;
      }
      .tab.is-active .tab-count { background: var(--brand-soft); color: var(--brand); }
      .panel { display: none; }
      .panel.is-active { display: block; }
      .panel .card { margin-bottom: 0; }
      /* Long lists scroll inside their own panel instead of stretching the page. */
      .panel .items { max-height: 340px; overflow-y: auto; padding-right: 2px; }
      .status { padding: 30px; text-align: center; color: var(--muted); }
      .status.is-error { color: var(--danger); }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div>
          <div class="topbar-title">Monthly Simulation <span class="dry-run">Dry run</span></div>
          <div class="topbar-sub" id="periodNote">Nothing here is saved to the sheets.</div>
        </div>
        <div class="topbar-period">
          <select id="simMonth" aria-label="Month"></select>
          <select id="simYear" aria-label="Year"></select>
          <button type="button" class="btn" id="resetBtn" title="Discard every change">Reset</button>
        </div>
      </div>

      <div class="summary" id="summary" hidden>
        <div class="hero">
          <div>
            <div class="hero-label">Remaining after everything</div>
            <div class="hero-value num" id="remainingValue">—</div>
          </div>
          <div class="hero-meta num" id="remainingMeta"></div>
        </div>
        <div class="bar" id="allocationBar" aria-hidden="true"></div>
        <div class="tiles" id="tiles"></div>
      </div>

      <div class="content" id="content">
        <div class="status" id="status">Loading…</div>
      </div>
    </div>

    <script>
      var DEFAULT_MONTH = <?!= defaultMonthLiteral ?>;
      var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
          'August', 'September', 'October', 'November', 'December'];
      var SHEETS = ['Saving', 'Expense', 'Ibadah', 'Autodeduct Jajan'];
      var TILES = [
        { key: 'income', label: 'Income', color: 'var(--brand)', inflow: true },
        { key: 'saving', label: 'Saving', color: 'var(--c-saving)' },
        { key: 'expense', label: 'Expense', color: 'var(--c-expense)' },
        { key: 'jajan', label: 'Jajan (net)', color: 'var(--c-jajan)' },
        { key: 'ibadah', label: 'Ibadah', color: 'var(--c-ibadah)' },
        { key: 'autodeduct', label: 'Autodeduct', color: 'var(--c-auto)' }
      ];
      var SHEET_KEYS = { 'Saving': 'saving', 'Expense': 'expense', 'Ibadah': 'ibadah', 'Autodeduct Jajan': 'autodeduct' };

      var payload = null;
      var state = null;      // the scenario being edited
      var baseline = null;   // totals of the untouched month
      var baseJajan = null;  // {gross, auto, net} per person at load
      var addedSeq = 0;

      /* ---------- Helpers ---------- */
      function $(id) { return document.getElementById(id); }
      function escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function money(n) {
        var v = Math.round(Number(n) || 0);
        return (v < 0 ? '-' : '') + 'Rp ' + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      }
      function pct(part, whole) {
        return whole > 0 ? (part / whole * 100).toFixed(1) + '%' : '—';
      }
      function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

      /**
       * Accepts 1.250.000, 1250000 or an expression such as 120.000*2.
       * Dots are thousand separators, a comma is the decimal mark.
       * @return {?number} null for blank, NaN for invalid.
       */
      function parseAmount(text) {
        var raw = String(text || '').trim();
        if (raw === '') return null;
        var expr = raw.replace(/\s+/g, '').replace(/\./g, '').replace(/,/g, '.');
        if (!/^[\d.+\-*/()]+$/.test(expr)) return NaN;
        try {
          var value = Function('"use strict"; return (' + expr + ');')();
          return (typeof value === 'number' && isFinite(value) && value >= 0) ? value : NaN;
        } catch (e) {
          return NaN;
        }
      }

      /* ---------- Period ---------- */
      function initPeriod() {
        var parts = String(DEFAULT_MONTH || '').split('-');
        var now = new Date();
        var year = Number(parts[0]) || now.getFullYear();
        var month = parts[1] ? Number(parts[1]) - 1 : now.getMonth();

        $('simMonth').innerHTML = MONTHS.map(function (name, i) {
          return '<option value="' + i + '"' + (i === month ? ' selected' : '') + '>' + name + '</option>';
        }).join('');
        var years = [];
        for (var y = year - 2; y <= year + 1; y++) years.push(y);
        $('simYear').innerHTML = years.map(function (y) {
          return '<option value="' + y + '"' + (y === year ? ' selected' : '') + '>' + y + '</option>';
        }).join('');

        $('simMonth').addEventListener('change', load);
        $('simYear').addEventListener('change', load);
        $('resetBtn').addEventListener('click', function () { if (payload) start(payload); });
      }

      function load() {
        $('summary').hidden = true;
        $('content').innerHTML = '<div class="status">Loading…</div>';
        google.script.run
            .withSuccessHandler(start)
            .withFailureHandler(function (err) {
              $('content').innerHTML = '<div class="status is-error">Could not load the month: ' +
                  escapeHtml(err && err.message ? err.message : err) + '</div>';
            })
            .getSimulationPayload(Number($('simMonth').value), Number($('simYear').value));
      }

      /* ---------- State ---------- */
      function start(data) {
        payload = data;
        // Re-key income onto the spelling the boxes use, so a category typed with
        // different case on the sheet cannot count twice.
        var canonical = {};
        categoryList().forEach(function (c) { canonical[c.trim().toLowerCase()] = c; });
        var income = {};
        payload.persons.forEach(function (p) {
          income[p] = {};
          var amounts = payload.income.amounts[p] || {};
          Object.keys(amounts).forEach(function (c) {
            var key = canonical[c.trim().toLowerCase()];
            income[p][key] = (income[p][key] || 0) + amounts[c];
          });
        });

        var items = {};
        SHEETS.forEach(function (sheet) {
          items[sheet] = payload.sections[sheet].items.map(function (it) {
            return { id: it.id, list: it.list, type: it.type, channel: it.channel, owner: it.owner,
                isCicilan: it.isCicilan, remaining: it.remaining, base: it.amount,
                included: true, override: null, added: false };
          });
        });

        var cats = {};
        payload.persons.forEach(function (p) { cats[p] = ['salary']; });

        state = { income: income, items: items, cats: cats, rates: {
          pool: payload.jajan.poolRate, Wiva: payload.jajan.wivaRate, Jane: payload.jajan.janeRate } };

        baseJajan = jajanFigures(state, null);
        baseline = totals(state);
        render();
        recalc();
      }

      function categoryList() {
        var seen = {};
        var list = [];
        (payload.categories || []).concat(payload.persons.reduce(function (acc, p) {
          return acc.concat(Object.keys(payload.income.amounts[p] || {}));
        }, [])).forEach(function (c) {
          var key = c.trim().toLowerCase();
          if (!seen[key]) { seen[key] = true; list.push(c); }
        });
        return list;
      }

      function itemAmount(it) {
        if (!it.included) return 0;
        if (it.override !== null && !isNaN(it.override)) return it.override;
        return it.base || 0;
      }

      function sumItems(list) {
        return list.reduce(function (s, it) { return s + itemAmount(it); }, 0);
      }

      /**
       * Gross share from income × pool rate × split, autodeduct per owner, and
       * net Jajan. With a baseline given, net moves by the change in gross and
       * autodeduct from that baseline, so an untouched month reproduces the
       * sheet's own Jajan rows exactly.
       */
      function jajanFigures(s, base) {
        var pool = 0;
        payload.persons.forEach(function (p) {
          var on = s.cats[p];
          var amounts = s.income[p] || {};
          Object.keys(amounts).forEach(function (cat) {
            if (on.indexOf(cat.trim().toLowerCase()) !== -1) pool += Number(amounts[cat]) || 0;
          });
        });
        pool = pool * (Number(s.rates.pool) || 0) / 100;

        var out = { gross: {}, auto: {}, net: {} };
        payload.persons.forEach(function (p) {
          out.gross[p] = pool * (Number(s.rates[p]) || 0) / 100;
          out.auto[p] = 0;
        });
        s.items['Autodeduct Jajan'].forEach(function (it) {
          var owner = it.owner;
          if (owner && out.auto[owner] !== undefined) out.auto[owner] += itemAmount(it);
        });
        payload.persons.forEach(function (p) {
          var net;
          if (base) {
            net = base.net[p] + (out.gross[p] - base.gross[p]) - (out.auto[p] - base.auto[p]);
          } else if (payload.jajan.net) {
            net = payload.jajan.net[p] || 0;
          } else {
            net = out.gross[p] - out.auto[p];
          }
          out.net[p] = Math.round(Math.max(0, net));
        });
        return out;
      }

      function totals(s) {
        var income = 0;
        payload.persons.forEach(function (p) {
          var amounts = s.income[p] || {};
          Object.keys(amounts).forEach(function (c) { income += Number(amounts[c]) || 0; });
        });
        var j = jajanFigures(s, baseJajan);
        var t = {
          income: income,
          saving: sumItems(s.items['Saving']),
          expense: sumItems(s.items['Expense']),
          ibadah: sumItems(s.items['Ibadah']),
          autodeduct: sumItems(s.items['Autodeduct Jajan']),
          jajan: payload.persons.reduce(function (sum, p) { return sum + j.net[p]; }, 0),
          jajanDetail: j
        };
        t.outflow = t.saving + t.expense + t.jajan + t.ibadah + t.autodeduct;
        t.remaining = t.income - t.outflow;
        return t;
      }

      /* ---------- Rendering ---------- */
      function sourceBadge(source, month) {
        return source === 'existing'
            ? '<span class="badge existing">from sheet</span>'
            : '<span class="badge projected">projected from ' + escapeHtml(month) + '</span>';
      }

      /** One tab per section; the pinned summary above keeps every total in view. */
      var SECTION_TABS = [
        { key: 'income', label: 'Income' },
        { key: 'jajan', label: 'Jajan' },
        { key: 'saving', label: 'Saving', sheet: 'Saving' },
        { key: 'expense', label: 'Expense', sheet: 'Expense' },
        { key: 'ibadah', label: 'Ibadah', sheet: 'Ibadah' },
        { key: 'autodeduct', label: 'Autodeduct', sheet: 'Autodeduct Jajan' }
      ];
      var activeSection = 'income';

      function render() {
        $('periodNote').textContent = 'Simulating ' + payload.targetMonth + ' — nothing here is saved to the sheets.';
        var strip = SECTION_TABS.map(function (tab) {
          return '<button type="button" class="tab' + (tab.key === activeSection ? ' is-active' : '') +
              '" role="tab" data-section="' + tab.key + '">' + tab.label +
              ' <span class="tab-count num" id="tabTotal-' + tab.key + '"></span></button>';
        }).join('');
        var panels = SECTION_TABS.map(function (tab) {
          var body = tab.key === 'income' ? renderIncome()
              : tab.key === 'jajan' ? renderJajan() : renderSection(tab.sheet);
          return '<div class="panel' + (tab.key === activeSection ? ' is-active' : '') +
              '" data-section="' + tab.key + '">' + body + '</div>';
        }).join('');
        $('content').innerHTML = '<div class="tab-strip" role="tablist">' + strip + '</div>' + panels;
        $('summary').hidden = false;
      }

      function activateSection(key) {
        activeSection = key;
        Array.prototype.forEach.call($('content').querySelectorAll('.tab, .panel'), function (el) {
          el.classList.toggle('is-active', el.dataset.section === key);
        });
      }

      function renderIncome() {
        var cats = categoryList();
        var panels = payload.persons.map(function (p) {
          var rows = cats.map(function (c) {
            var v = state.income[p][c];
            return '<div class="income-row"><span title="' + escapeHtml(c) + '">' + escapeHtml(c) + '</span>' +
                '<input type="text" class="income-input num" data-person="' + escapeHtml(p) + '" data-cat="' +
                escapeHtml(c) + '" value="' + (v ? escapeHtml(money(v).replace('Rp ', '')) : '') + '" placeholder="0"></div>';
          }).join('');
          return '<div class="subpanel"><div class="subpanel-head"><span>' + escapeHtml(p) +
              '</span><span class="num" id="incomeTotal-' + escapeHtml(p) + '"></span></div>' + rows + '</div>';
        }).join('');
        return '<div class="card"><div class="card-head"><h3 class="card-title">Income' +
            sourceBadge(payload.income.source, payload.income.month) + '</h3>' +
            '<span class="card-total num" id="total-income"></span></div><div class="grid-2">' + panels + '</div></div>';
      }

      function renderJajan() {
        var cats = categoryList();
        var chips = payload.persons.map(function (p) {
          return '<div><label>' + escapeHtml(p) + ' — income counted</label><div class="chip-set">' +
              cats.map(function (c) {
                var on = state.cats[p].indexOf(c.trim().toLowerCase()) !== -1;
                return '<label class="chip' + (on ? ' is-on' : '') + '"><input type="checkbox" class="jajan-cat" data-person="' +
                    escapeHtml(p) + '" value="' + escapeHtml(c) + '"' + (on ? ' checked' : '') + '>' + escapeHtml(c) + '</label>';
              }).join('') + '</div></div>';
        }).join('');
        var note = payload.jajan.source === 'existing'
            ? 'Starts from the month\'s Jajan rows; rates inferred from them'
            : 'No Jajan rows yet — calculated like Generate Monthly';
        return '<div class="card"><div class="card-head"><h3 class="card-title">Jajan' +
            sourceBadge(payload.jajan.source === 'existing' ? 'existing' : 'projected', payload.sourceMonth) +
            '</h3><span class="card-note">' + note + '</span></div>' +
            '<div class="rate-row">' +
            '<div><label for="rate-pool">Pool rate (% of income)</label><input type="number" class="rate-input" id="rate-pool" data-key="pool" min="0" max="100" step="0.01" value="' + state.rates.pool + '"></div>' +
            payload.persons.map(function (p) {
              return '<div><label for="rate-' + escapeHtml(p) + '">' + escapeHtml(p) + ' split %</label><input type="number" class="rate-input" id="rate-' +
                  escapeHtml(p) + '" data-key="' + escapeHtml(p) + '" min="0" max="100" step="0.01" value="' + state.rates[p] + '"></div>';
            }).join('') + '</div>' +
            '<div class="grid-2">' + chips + '</div>' +
            '<table class="jajan-table"><thead><tr><th>Person</th><th>Gross share</th><th>Autodeduct</th><th>Net (baseline)</th><th>Net (simulated)</th></tr></thead>' +
            '<tbody id="jajanBody"></tbody></table></div>';
      }

      function renderSection(sheet) {
        var section = payload.sections[sheet];
        var rows = state.items[sheet].map(function (it) { return renderItem(sheet, it); }).join('');
        return '<div class="card" data-sheet="' + escapeHtml(sheet) + '"><div class="card-head"><h3 class="card-title">' +
            escapeHtml(sheet) + sourceBadge(section.source, payload.sourceMonth) + '</h3>' +
            '<span class="card-total num" id="total-' + SHEET_KEYS[sheet] + '"></span></div>' +
            '<div class="items">' + (rows || '<div class="empty">No items.</div>') + '</div>' +
            '<button type="button" class="btn btn-add" data-sheet="' + escapeHtml(sheet) + '">+ Add item</button></div>';
      }

      function renderItem(sheet, it) {
        if (it.added) {
          var types = payload.typeOptions[sheet] || [];
          return '<div class="item is-added" data-id="' + escapeHtml(it.id) + '">' +
              '<input type="text" class="item-list" placeholder="Item name" value="' + escapeHtml(it.list) + '">' +
              '<select class="item-type">' + types.map(function (t) {
                return '<option' + (t === it.type ? ' selected' : '') + '>' + escapeHtml(t) + '</option>';
              }).join('') + '</select>' +
              '<input type="text" class="item-amount num" placeholder="Amount" value="">' +
              '<button type="button" class="btn btn-remove" title="Remove">✕</button></div>';
        }
        var meta = [it.type, it.channel].filter(function (v) { return v && v !== '—'; }).join(' · ');
        var cicilan = it.isCicilan ? '<span class="cicilan">cicilan' + (it.remaining !== null ? ' · ' + it.remaining + ' left' : '') + '</span>' : '';
        return '<div class="item" data-id="' + escapeHtml(it.id) + '">' +
            '<input type="checkbox" class="item-include" checked title="Include in this month">' +
            '<div class="item-main"><div class="item-name" title="' + escapeHtml(it.list) + '">' + escapeHtml(it.list) + '</div>' +
            '<div class="item-meta">' + escapeHtml(meta) + cicilan + '</div></div>' +
            '<div class="item-base num">' + money(it.base) + '</div>' +
            '<input type="text" class="item-amount num" placeholder="same"></div>';
      }

      /* ---------- Events ---------- */
      function findItem(sheet, id) {
        var list = state.items[sheet];
        for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
        return null;
      }

      function bindEvents() {
        var content = $('content');
        content.addEventListener('input', onInput);
        content.addEventListener('change', onInput);
        content.addEventListener('click', onClick);
      }

      function onInput(e) {
        var el = e.target;
        if (el.classList.contains('income-input')) {
          var v = parseAmount(el.value);
          el.classList.toggle('is-invalid', isNaN(v) && v !== null);
          state.income[el.dataset.person][el.dataset.cat] = (v === null || isNaN(v)) ? 0 : v;
        } else if (el.classList.contains('rate-input')) {
          var r = Number(el.value);
          var ok = el.value !== '' && isFinite(r) && r >= 0 && r <= 100;
          el.classList.toggle('is-invalid', !ok);
          state.rates[el.dataset.key] = ok ? r : 0;
        } else if (el.classList.contains('jajan-cat')) {
          var set = state.cats[el.dataset.person];
          var key = el.value.trim().toLowerCase();
          var at = set.indexOf(key);
          if (el.checked && at === -1) set.push(key);
          if (!el.checked && at !== -1) set.splice(at, 1);
          el.parentNode.classList.toggle('is-on', el.checked);
        } else {
          var row = el.closest('.item');
          if (!row) return;
          var sheet = el.closest('.card').dataset.sheet;
          var it = findItem(sheet, row.dataset.id);
          if (!it) return;
          if (el.classList.contains('item-include')) {
            it.included = el.checked;
            row.classList.toggle('is-off', !el.checked);
          } else if (el.classList.contains('item-amount')) {
            var amount = parseAmount(el.value);
            el.classList.toggle('is-invalid', isNaN(amount) && amount !== null);
            if (it.added) {
              it.base = (amount === null || isNaN(amount)) ? 0 : amount;
            } else {
              it.override = (amount === null || isNaN(amount)) ? null : amount;
              row.classList.toggle('is-changed', it.override !== null);
              row.querySelector('.item-base').classList.toggle('is-struck', it.override !== null);
            }
          } else if (el.classList.contains('item-list')) {
            it.list = el.value;
          } else if (el.classList.contains('item-type')) {
            it.type = el.value;
            if (sheet === 'Autodeduct Jajan') it.owner = el.value;
          }
        }
        recalc();
      }

      function onClick(e) {
        var el = e.target;
        var tab = el.closest('.tab');
        if (tab) {
          activateSection(tab.dataset.section);
          return;
        }
        if (el.classList.contains('btn-add')) {
          var sheet = el.dataset.sheet;
          var types = payload.typeOptions[sheet] || [];
          var it = { id: 'new-' + (++addedSeq), list: '', type: types[0] || '', channel: '',
              owner: sheet === 'Autodeduct Jajan' ? (types[0] || '') : '', isCicilan: false,
              remaining: null, base: 0, included: true, override: null, added: true };
          state.items[sheet].push(it);
          var list = el.parentNode.querySelector('.items');
          var empty = list.querySelector('.empty');
          if (empty) empty.remove();
          list.insertAdjacentHTML('beforeend', renderItem(sheet, it));
          list.lastElementChild.querySelector('.item-list').focus();
          recalc();
        } else if (el.classList.contains('btn-remove')) {
          var row = el.closest('.item');
          var sheetName = el.closest('.card').dataset.sheet;
          state.items[sheetName] = state.items[sheetName].filter(function (x) { return x.id !== row.dataset.id; });
          row.remove();
          recalc();
        }
      }

      /* ---------- Summary ---------- */
      function deltaHtml(diff, inflow) {
        if (Math.round(diff) === 0) return '<span class="delta flat">no change</span>';
        // An inflow going up, or an outflow going down, leaves more money.
        var good = inflow ? diff > 0 : diff < 0;
        return '<span class="delta ' + (good ? 'good' : 'bad') + '">' + (diff > 0 ? '+' : '−') +
            money(Math.abs(diff)) + '</span>';
      }

      function recalc() {
        var t = totals(state);

        $('remainingValue').textContent = money(t.remaining);
        $('remainingValue').classList.toggle('is-negative', t.remaining < 0);
        $('remainingMeta').innerHTML = pct(t.remaining, t.income) + ' of income · ' +
            deltaHtml(t.remaining - baseline.remaining, true) + ' vs baseline';

        $('tiles').innerHTML = TILES.map(function (tile) {
          var value = t[tile.key];
          return '<div class="tile" style="border-left-color:' + tile.color + '">' +
              '<div class="tile-label">' + tile.label + '</div>' +
              '<div class="tile-value num">' + money(value) + '</div>' +
              '<div class="tile-meta num"><span>' + (tile.inflow ? '100%' : pct(value, t.income)) + '</span>' +
              deltaHtml(value - baseline[tile.key], tile.inflow) + '</div></div>';
        }).join('');

        var scale = Math.max(t.income, t.outflow) || 1;
        var segments = TILES.filter(function (x) { return !x.inflow; }).map(function (tile) {
          return '<span style="width:' + (t[tile.key] / scale * 100) + '%;background:' + tile.color +
              '" title="' + tile.label + ' ' + money(t[tile.key]) + '"></span>';
        }).join('');
        $('allocationBar').innerHTML = segments;
        $('allocationBar').style.background = t.remaining < 0 ? 'var(--danger)' : 'var(--c-left)';

        $('total-income').textContent = money(t.income);
        payload.persons.forEach(function (p) {
          var el = $('incomeTotal-' + p);
          if (!el) return;
          var amounts = state.income[p];
          el.textContent = money(Object.keys(amounts).reduce(function (s, c) { return s + (Number(amounts[c]) || 0); }, 0));
        });
        SHEETS.forEach(function (sheet) {
          var key = SHEET_KEYS[sheet];
          $('total-' + key).innerHTML = money(t[key]) + ' · ' + pct(t[key], t.income);
        });
        SECTION_TABS.forEach(function (tab) {
          var el = $('tabTotal-' + tab.key);
          if (el) el.textContent = money(t[tab.key]).replace('Rp ', '');
        });

        var j = t.jajanDetail;
        $('jajanBody').innerHTML = payload.persons.map(function (p) {
          return '<tr><td>' + escapeHtml(p) + '</td><td class="num">' + money(j.gross[p]) + '</td>' +
              '<td class="num">' + money(j.auto[p]) + '</td><td class="num">' + money(baseJajan.net[p]) + '</td>' +
              '<td class="num strong">' + money(j.net[p]) + '</td></tr>';
        }).join('');
      }

      initPeriod();
      bindEvents();
      load();
    </script>
  </body>
</html>
